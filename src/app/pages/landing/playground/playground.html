<div class="pf-host pf-card">
  <!-- chrome bar -->
  <div class="pf-chrome">
    <span class="dot dot--red"></span>
    <span class="dot dot--amber"></span>
    <span class="dot dot--teal"></span>
    <span class="pf-chrome__title">forge-form · live playground</span>
    <button type="button" class="pf-reset" (click)="reset()">↺ reset</button>
  </div>

  <div class="pf-split">
    <!-- left: editable JSON schema -->
    <div class="pf-source">
      <div class="pf-source__label">
        <span>FormSchema</span>
        <span class="pf-source__rule"></span>
        <span class="pf-source__hint">edit to update live</span>
      </div>
      <textarea
        class="pf-editor"
        [value]="jsonSource()"
        (input)="onSourceChange($any($event.target).value)"
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
      ></textarea>
    </div>

    <!-- right: rendered, live output -->
    <div class="pf-output">
      <div class="pf-output__label">
        <span>Rendered output</span>
        <span class="pf-output__rule"></span>
      </div>

      @if (parseError()) {
        <div class="pf-error">
          <span class="pf-error__tag">SyntaxError</span>
          <pre class="pf-error__msg">{{ parseError() }}</pre>
        </div>
      }

      <forge-form-angular [schema]="schema()" (formSubmit)="onSubmit()" />

      @if (submitted()) {
        <span class="pf-ok">✓ Valid - submitted</span>
      }

      <div class="pf-value">
        <div class="pf-value__comment">// form.value() - signal, live</div>
        <div class="pf-value__json">{{ valueJson }}</div>
      </div>
    </div>
  </div>
</div>
