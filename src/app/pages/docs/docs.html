<app-header />

<div class="docs">
  <!-- mobile TOC toggle -->
  <button type="button" class="docs__sidebar-toggle" (click)="toggleMenu()">
    <span>{{ menuOpen() ? '✕' : '☰' }}</span> Contents
  </button>

  <!-- dim backdrop behind the mobile drawer -->
  <div
    class="docs__backdrop"
    [class.open]="menuOpen()"
    (click)="toggleMenu()"
    aria-hidden="true"
  ></div>

  <aside class="docs__sidebar" [class.open]="menuOpen()">
    <div class="docs__sidebar-heading">
      <span>Contents</span>
      <button
        type="button"
        class="docs__sidebar-close"
        (click)="toggleMenu()"
        aria-label="Close menu"
      >
        ✕
      </button>
    </div>
    <nav class="docs__sidebar-nav">
      @for (entry of toc(); track entry.id) {
        <a
          [href]="'#' + entry.id"
          class="docs__sidebar-link"
          [class.docs__sidebar-link--nested]="entry.level === 3"
          [class.active]="activeId() === entry.id"
          (click)="goTo(entry, $event)"
        >
          {{ entry.text }}
        </a>
      }
    </nav>
  </aside>

  <main class="docs__main">
    @if (safeHtml()) {
      <article
        #docBody
        class="markdown"
        [innerHTML]="safeHtml()"
        (click)="onContentClick($event)"
      ></article>
    } @else {
      <div class="docs__loading">Loading documentation…</div>
    }
    <app-footer />
  </main>
</div>
