<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" routerLink="/" aria-label="forge-form home">
      <app-logo [width]="34" [height]="21" />
      <span class="site-header__wordmark">ForgeForm</span>
    </a>

    <nav class="site-header__nav">
      <a routerLink="/docs" class="site-header__link">Docs</a>
      <a routerLink="/playground" class="site-header__link">Playground</a>
      <span class="site-header__divider" aria-hidden="true"></span>
      <a
        [href]="githubUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="site-header__link site-header__link--icon"
      >
        <app-github-icon [size]="17" />
        GitHub
      </a>
      <a
        [href]="npmUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="site-header__link"
      >
        npm
      </a>
    </nav>

    <nav class="site-header__mobile">
      <a routerLink="/docs" class="site-header__mobile-link">Docs</a>
      <a routerLink="/playground" class="site-header__mobile-link">
        Playground
      </a>
      <span class="site-header__divider" aria-hidden="true"></span>
      <a
        [href]="githubUrl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
      >
        <app-github-icon [size]="20" />
      </a>
      <a
        [href]="npmUrl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="npm"
      >
        <app-npm-icon [size]="20" />
      </a>
    </nav>
  </div>
</header>
