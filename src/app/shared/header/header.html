<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" routerLink="/" aria-label="forge-form home">
      <app-logo [width]="34" [height]="21" />
      <span class="site-header__wordmark">ForgeForm</span>
      @if (meta(); as m) {
        <span class="site-header__version-badge">v{{ m.version }}</span>
      }
    </a>

    <nav class="site-header__nav">
      <a routerLink="/docs" fragment="quick-start">Quick Start</a>
      <a routerLink="/docs">Docs</a>
      <a
        [href]="githubUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="site-header__github"
      >
        <app-github-icon [size]="15" />
        GitHub
      </a>
    </nav>

    <div class="site-header__actions">
      <button
        type="button"
        class="site-header__install-cmd"
        (click)="copyInstall()"
        [attr.aria-label]="'Copy install command'"
        [title]="copied() ? 'Copied!' : 'Click to copy'"
      >
        {{ copied() ? '✓ copied' : install }}
      </button>
      <a routerLink="/docs" class="site-header__cta-btn">Get started</a>
    </div>
  </div>
</header>
