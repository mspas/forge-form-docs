<header class="hd">
  <div class="hd__inner">
    <a class="hd__brand" routerLink="/" aria-label="forge-form home">
      <app-logo [width]="34" [height]="21" />
      <span class="hd__wordmark">forge-form</span>
      <span class="hd__pill">v1.0</span>
    </a>

    <nav class="hd__nav">
      <a routerLink="/docs">Docs</a>
      <a routerLink="/" fragment="playground">Playground</a>
      <a routerLink="/docs" fragment="public-api-surface-exports">Reference</a>
      <a [href]="githubUrl" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>

    <div class="hd__actions">
      <button
        type="button"
        class="hd__code"
        (click)="copyInstall()"
        [attr.aria-label]="'Copy install command'"
        [title]="copied() ? 'Copied!' : 'Click to copy'"
      >
        {{ copied() ? '✓ copied' : install }}
      </button>
      <a routerLink="/docs" class="hd__cta">Get started</a>
    </div>
  </div>
</header>
