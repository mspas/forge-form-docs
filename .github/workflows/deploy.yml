name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages and let one in-progress
# deploy finish before the next starts.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Using `npm install` (not `npm ci`): the lockfile is generated on
      # Windows, which omits Linux-only optional deps (the @emnapi/* wasm
      # fallback for native build tools). `npm ci` rejects that mismatch;
      # `npm install` reconciles it on the Linux runner.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Served from the apex custom domain (forgeform.dev, via public/CNAME),
      # so the app is built at the site root.
      - name: Build
        run: npm run build -- --base-href /

      # Known routes (/ and /docs) are prerendered to their own index.html, so
      # deep links work directly. For any *unknown* path, GitHub Pages serves
      # 404.html - point it at the CSR shell so the Angular app boots and its
      # wildcard route redirects home. .nojekyll keeps Pages from filtering files.
      - name: Prepare SPA fallback
        run: |
          cp dist/forge-form-docs/browser/index.csr.html dist/forge-form-docs/browser/404.html
          touch dist/forge-form-docs/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/forge-form-docs/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
